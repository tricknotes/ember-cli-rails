name: "CI Tests"

on:
  push:
    branches:
      - main
  pull_request:

# Builds run third-party code (gems, npm packages, the latest pnpm 10), so
# hand them a token that can only read the repository.
permissions:
  contents: read

jobs:
  build:
    # Named explicitly so that `experimental` stays out of the job name.
    name: "build (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }}, ember-cli ${{ matrix.ember }}, ${{ matrix.package_manager }})"
    runs-on: "ubuntu-latest"

    # Jobs normally finish in about 3 minutes; a hung job once ran for
    # 2 hours until it was cancelled by hand, so cap the runtime.
    timeout-minutes: 15

    # Rails main is a moving target, so let it break without failing the build.
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["7.2", "8.0", "8.1"]
        # `ember` is the `ember-cli/ember-new-output` tag used for the
        # dummy app. `>= 6.8` uses the Vite-based blueprint, older
        # versions use the classic Broccoli-based build.
        ember: ["7.0.0"]
        # `package_manager` installs the dummy app's NodeJS dependencies:
        # `npm`, `yarn`, or `pnpm`.
        package_manager: ["npm"]
        include:
          - ruby: "4.0"
            rails: "main"
            ember: "7.0.0"
            package_manager: "npm"
            experimental: true
          # Classic (Broccoli-based) blueprint coverage
          - ruby: "3.4"
            rails: "8.1"
            ember: "5.12.0"
            package_manager: "npm"
          - ruby: "3.4"
            rails: "8.1"
            ember: "6.7.2"
            package_manager: "npm"
          # Yarn and pnpm coverage, for both blueprints
          - ruby: "3.4"
            rails: "8.1"
            ember: "7.0.0"
            package_manager: "yarn"
          - ruby: "3.4"
            rails: "8.1"
            ember: "5.12.0"
            package_manager: "yarn"
          - ruby: "3.4"
            rails: "8.1"
            ember: "7.0.0"
            package_manager: "pnpm"
          - ruby: "3.4"
            rails: "8.1"
            ember: "5.12.0"
            package_manager: "pnpm"

    env:
      RAILS_ENV: "test"
      RAILS_VERSION: "${{ matrix.rails }}"
      EMBER_VERSION: "${{ matrix.ember }}"
      PACKAGE_MANAGER: "${{ matrix.package_manager }}"

    steps:
    - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      with:
        persist-credentials: false

    - name: "Install NodeJS"
      uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
      with:
        node-version: "26.x"

    - name: "Install Yarn"
      if: "matrix.package_manager == 'yarn'"
      run: |
        npm install -g yarn@1

    - name: "Install pnpm"
      if: "matrix.package_manager == 'pnpm'"
      run: |
        npm install -g pnpm@latest-10

    - name: "Install Ruby ${{ matrix.ruby }}"
      uses: "ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8" # v1.331.0
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler-cache: true

    - name: "Run Setup"
      run: |
        bin/setup

    - name: "Run Tests"
      run: |
        bin/rake
